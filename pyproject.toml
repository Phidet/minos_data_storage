[project]
name = "minos-data-storage"
version = "0.1.0"
description = "Convert MINOS SNTP ntuples to HDF5 or ROOT for long-term archival"
requires-python = ">=3.10"
# Only what the tools import. Kept minimal because this has to install on a
# Fermilab gpvm to run the conversion next to the tape system.
dependencies = [
    "awkward>=2.13.0",
    "h5py>=3.13.0",
    "numpy>=2.2.6",
    "uproot>=5.7.5",
]
